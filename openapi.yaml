openapi: 3.0.3
info:
  title: Onde Farma API
  version: 1.0.0
  description: REST API para consulta de farmácias migrada para AWS Lambda + API Gateway.
servers:
  - url: http://localhost:4566/restapis/{apiId}/$default/_user_request_
    description: LocalStack HTTP API Gateway
    variables:
      apiId:
        default: local-api-id
  - url: https://api.ondefarma.com.br
    description: Production (placeholder)
tags:
  - name: Pharmacies
    description: Endpoints de consulta de farmácias
paths:
  /v1/pharmacies:
    get:
      tags: [Pharmacies]
      summary: Lista farmácias com filtros e paginação
      parameters:
        - in: query
          name: state
          schema:
            type: string
            example: MG
        - in: query
          name: city
          schema:
            type: string
            example: BELO HORIZONTE
        - in: query
          name: neighborhood
          schema:
            type: string
            example: CENTRO
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Lista paginada de farmácias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pharmacy'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/pharmacies/states:
    get:
      tags: [Pharmacies]
      summary: Lista estados disponíveis
      responses:
        '200':
          description: Estados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: MG
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/pharmacies/cities:
    get:
      tags: [Pharmacies]
      summary: Lista cidades por estado
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
            example: MG
      responses:
        '200':
          description: Cidades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: BELO HORIZONTE
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/pharmacies/neighborhoods:
    get:
      tags: [Pharmacies]
      summary: Lista bairros por estado e cidade
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
            example: MG
        - in: query
          name: city
          required: true
          schema:
            type: string
            example: BELO HORIZONTE
      responses:
        '200':
          description: Bairros
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: CENTRO
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/pharmacies/by-cnpj:
    post:
      tags: [Pharmacies]
      summary: Busca farmácias por lista de CNPJs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByCNPJRequest'
      responses:
        '200':
          description: Farmácias encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pharmacy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Pharmacy:
      type: object
      required: [id, cnpj, name, address, neighborhood, city, state]
      properties:
        id:
          type: string
          format: uuid
        cnpj:
          type: string
          pattern: '^[0-9]{14}$'
          example: '21651625000193'
        name:
          type: string
          example: A BOTICA DROGARIA LTDA
        address:
          type: string
          example: RUA MACAÉ, Nº 373
        neighborhood:
          type: string
          example: BAIRRO DA GRAÇA
        city:
          type: string
          example: BELO HORIZONTE
        state:
          type: string
          example: MG
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPrevPage]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
    ByCNPJRequest:
      type: object
      required: [cnpjs]
      properties:
        cnpjs:
          type: array
          maxItems: 500
          items:
            type: string
            example: '21651625000193'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Request inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erro interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
