services:
  postgres:
    image: postgres:16-alpine
    container_name: ondefarma-postgres
    environment:
      POSTGRES_DB: ondefarma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ondefarma"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: ondefarma-localstack
    environment:
      SERVICES: lambda,apigateway,iam,s3,cloudwatch,logs,sts
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
